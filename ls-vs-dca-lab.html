<html lang="zh-Hant">
<head>
<meta charset="utf-8">

<title>一次投入 vs 定期定額 · 起點敏感度實驗室</title>
<style>
  :root{
    --fg: var(--foreground, #1b1f24);
    --mut: var(--muted-foreground, #6b7280);
    --acc: var(--accent, #2f6feb);
    --bd: var(--border, #d8dce2);
    --card: var(--card, #ffffff);
    --grid: color-mix(in srgb, var(--bd) 70%, transparent);
  }
  html.standalone{ --fg:#e7e9ee; --mut:#98a1ad; --acc:#7aa2ff; --bd:#2b313a; --card:#161a20; --grid:#2a3039; background:#0e1115; }
  *{box-sizing:border-box}
  body{margin:0;padding:2px 0 6px;color:var(--fg);font-family:inherit,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;font-variant-numeric:tabular-nums}
  .app{max-width:1100px}
  header{display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 16px;margin-bottom:10px}
  h1{margin:0;font-size:16.5px;font-weight:650;letter-spacing:.2px}
  .src{font-size:11px;color:var(--mut);line-height:1.5}
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:7px;margin-bottom:9px}
  .grp{display:flex;border:1px solid var(--bd);border-radius:7px;overflow:hidden}
  .grp button{border:0;background:transparent;color:var(--mut);font:inherit;font-size:11.5px;padding:5px 10px;cursor:pointer;border-right:1px solid var(--bd)}
  .grp button:last-child{border-right:0}
  .grp button[aria-pressed="true"]{background:color-mix(in srgb,var(--acc) 16%,transparent);color:var(--fg);font-weight:600}
  .grp button:hover{color:var(--fg)}
  select{font:inherit;font-size:11.5px;padding:5px 8px;border-radius:7px;border:1px solid var(--bd);background:var(--card);color:var(--fg)}
  .lab{font-size:11px;color:var(--mut);margin-left:4px}
  .cards{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .card{flex:1 1 150px;min-width:132px;border:1px solid var(--bd);border-radius:8px;padding:7px 10px 8px;background:var(--card)}
  .card .k{font-size:10.5px;color:var(--mut);margin-bottom:3px}
  .card .v{font-size:17px;font-weight:640;line-height:1.15}
  .card .d{font-size:10.5px;color:var(--mut);margin-top:2px}
  .up{color:#2f9e6f}.dn{color:#d9534f}
  .plot{position:relative;border:1px solid var(--bd);border-radius:9px;background:var(--card);padding:6px 4px 2px;overflow:hidden}
  .plot.small{padding:4px 4px 2px}
  canvas{display:block;width:100%;cursor:crosshair}
  #cvA{height:330px} #cvB{height:132px}
  .tip{position:absolute;pointer-events:none;display:none;z-index:5;background:var(--card);border:1px solid var(--bd);border-radius:7px;padding:6px 9px;font-size:11.5px;line-height:1.55;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
  .tip .hd{color:var(--mut);margin-bottom:3px}
  .tip .r{display:flex;justify-content:space-between;gap:14px}
  .tip .r b{font-weight:640}
  .hint{font-size:10.5px;color:var(--mut);margin:6px 2px 12px;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:11.5px;margin-top:4px}
  caption{text-align:left;font-size:11.5px;color:var(--mut);padding-bottom:5px}
  th,td{padding:4px 8px;border-bottom:1px solid var(--grid);text-align:right}
  th:first-child,td:first-child{text-align:left}
  thead th{color:var(--mut);font-weight:600;border-bottom:1px solid var(--bd)}
  tbody tr:hover{background:color-mix(in srgb,var(--acc) 8%,transparent)}
  .note{font-size:10.5px;color:var(--mut);margin-top:12px;line-height:1.65}
  .verdict{font-size:12.5px;margin:2px 0 10px;padding:8px 11px;border-radius:8px;border:1px solid var(--bd);background:var(--card);line-height:1.6}
  .verdict b{font-weight:650}
</style>
</head>

  <header>

  <div class="bar">

    <div class="tip" id="tipA"></div>

  <div class="plot small" id="plotB">

  </div>

/* ---------- 模擬 ---------- */
function simulate(asset, s, months, contribs) {
  const p = asset.p, n = p.length;
  const e = s + months;
  if (s < 0 || e > n - 1) return null;
  const ls = TOTAL * p[e] / p[s];
  const k = Math.min(contribs, e - s);
  const per = TOTAL / k;
  let shares = 0;
  for (let i = 0; i < k; i++) shares += per / p[s + i];
  const dca = shares * p[e];
  return { ls, dca, e, k, per, shares, base: p[s], p };
}
function irrMonthly(fv, months, contribs, amount) {
  let lo = -0.02, hi = 0.10, mid = 0;
  for (let it = 0; it < 300; it++) {
    mid = (lo + hi) / 2;
    let v = 0;
    for (let k = 0; k < contribs; k++) v += amount * Math.pow(1 + mid, months - k);
    if (v < fv) lo = mid; else hi = mid;
  }
  return mid;
}
function irrDca(sim, months) {
  const m = irrMonthly(sim.dca, months, sim.k, sim.per);
  return Math.pow(1 + m, 12) - 1;
}
function irrLs(sim, months) {
  return Math.pow(sim.ls / TOTAL, 12 / months) - 1;
}

/* ---------- 曲線（每月估值） ---------- */
function curves(sim, s, months) {
  const p = sim.p, k = sim.k, per = sim.per;
  let shares = 0;
  const out = [];
  for (let i = 0; i <= months; i++) {
    if (i < k) shares += per / p[s + i];
    out.push({ i, ls: TOTAL * p[s + i] / p[s], dca: shares * p[s + i] });
  }
  return out;
}

/* ---------- Canvas 基礎 ---------- */
function setupCanvas(cv) {
  const r = cv.getBoundingClientRect();
  const dpr = window.devicePixelRatio || 1;
  cv.width = Math.round(r.width * dpr); cv.height = Math.round(r.height * dpr);
  const ctx = cv.getContext('2d');
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  return { ctx, W: r.width, H: r.height };
}
function niceStep(range, target) {
  const raw = range / target, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  return (n < 1.5 ? 1 : n < 3 ? 2 : n < 7 ? 5 : 10) * mag;
}
function fmtAxis(v) {
  if (v >= 1e6) return (v / 1e6).toFixed(2) + 'M';
  if (v >= 1e3) return Math.round(v / 1e3) + 'k';
  return v.toFixed(0);
}

  const y = STATE.hold / 12;
  const iLS = irrLs(sim, STATE.hold), iD = irrDca(sim, STATE.hold);
  const win = sim.ls >= sim.dca ? 'LS' : 'DCA';
  const diff = sim.ls - sim.dca, diffPct = diff / sim.dca;
  const items = [
    ['一次投入 LS 期末', fmtMoney(sim.ls), '年化 ' + (iLS * 100).toFixed(2) + '%　（' + y.toFixed(1) + ' 年）', ''],
    ['定期定額 DCA 期末', fmtMoney(sim.dca), '年化 ' + (iD * 100).toFixed(2) + '%　（前 ' + sim.k + ' 期分批）', ''],
    ['差額', (diff >= 0 ? '+' : '') + fmtMoney(diff), (diff >= 0 ? 'LS 多賺 ' : 'DCA 多賺 ') + fmtPct(Math.abs(diffPct)), diff >= 0 ? 'up' : 'dn'],
    ['勝方', win === 'LS' ? '一次投入' : '定期定額', '總投入 100,000（不分勝負時以 LS 計）', '']
  ];
  items.forEach(([k, v, d, cls]) => {
    const el = document.createElement('div'); el.className = 'card';
    const a = document.createElement('div'); a.className = 'k'; a.textContent = k;
    const b = document.createElement('div'); b.className = 'v ' + cls; b.textContent = v;
    const c = document.createElement('div'); c.className = 'd'; c.textContent = d;
    el.append(a, b, c); box.appendChild(el);
  });
}

function renderVerdict() {
  const roll = computeRolling();
  const el = document.getElementById('verdict');
  if (!roll.length) { el.textContent = '資料不足，無法計算。'; return; }
  const lsWin = roll.filter(r => r.diff >= 0).length;
  const pct = lsWin / roll.length;
  const avg = roll.reduce((a, r) => a + r.diff, 0) / roll.length;
  const best = roll.reduce((a, r) => r.diff > a.diff ? r : a, roll[0]);
  const worst = roll.reduce((a, r) => r.diff < a.diff ? r : a, roll[0]);
  const s = simulate(A(), STATE.startIdx, STATE.hold, STATE.contribs);
  el.textContent = '';
  const mk = (tag, txt) => { const n = document.createElement(tag); n.textContent = txt; return n; };
  el.appendChild(mk('span', '結論：'));
  el.appendChild(mk('b', A().name + '、持有 ' + (STATE.hold / 12) + ' 年、前 ' + STATE.contribs + ' 期分批'));
  el.appendChild(mk('span', '　→　全部 ' + roll.length + ' 個可能起點中，一次投入（LS）贏 ' + lsWin + ' 次（' + (pct * 100).toFixed(0) + '%）；平均勝差 ' + fmtPct(avg) + '。最有利 LS 的起點是 ' + best.date + '（' + fmtPct(best.diff) + '），最有利 DCA 的是 ' + worst.date + '（' + fmtPct(worst.diff) + '）。'));
  if (s) {
    el.appendChild(mk('span', '　你目前選的 ' + A().d[STATE.startIdx] + ' 起點，' + (s.ls >= s.dca ? 'LS 贏' : 'DCA 贏') + '。'));
  }
  document.getElementById('rangeA').textContent = A().d[STATE.startIdx] + ' → ' + (CUR ? A().d[STATE.startIdx + STATE.hold] : '—');
  document.getElementById('rangeB').textContent = roll[0].date + ' → ' + roll[roll.length - 1].date + '（共 ' + roll.length + ' 個起點）';
}

const YEARS = [1990,1995,2000,2003,2005,2007,2009,2011,2013,2015,2017,2019,2021,2023];
function renderTable() {
  const tb = document.querySelector('#tbl tbody');
  tb.textContent = '';
  const asset = A();
  YEARS.forEach(yr => {
    const target = yr + '-01';
    let s = asset.d.findIndex(x => x >= target);
    if (s < 0 || s + STATE.hold > asset.p.length - 1) return;
    const sim = simulate(asset, s, STATE.hold, STATE.contribs);
    if (!sim) return;
    const diff = sim.ls - sim.dca;
    const tr = document.createElement('tr');
    const cells = [
      asset.d[s],
      fmtMoney(sim.ls),
      fmtMoney(sim.dca),
      (diff >= 0 ? '+' : '') + fmtMoney(diff),
      (irrLs(sim, STATE.hold) * 100).toFixed(2) + '%',
      (irrDca(sim, STATE.hold) * 100).toFixed(2) + '%',
      diff >= 0 ? '一次投入' : '定期定額'
    ];
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      td.textContent = v;
      if (i === 6) td.style.fontWeight = '600';
      if (i === 6) td.className = diff >= 0 ? 'up' : 'dn';
      tr.appendChild(td);
    });
    tb.appendChild(tr);
  });
}

/* ---------- UI ---------- */
function buildAssetBtns() {
  const box = document.getElementById('assetGrp');
  box.textContent = '';
  Object.entries(ASSETS).forEach(([k, a]) => {
    const b = document.createElement('button');
    b.dataset.k = k; b.textContent = k;
    b.setAttribute('aria-pressed', String(k === STATE.key));
    b.addEventListener('click', () => {
      const keepDate = A().d[STATE.startIdx];
      STATE.key = k;
      box.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.k === k)));
      ensureHold();
      const near = A().d.findIndex(x => x >= keepDate);
      STATE.startIdx = near < 0 ? 0 : near;
      clampStart(); syncSelects(); refresh();
    });
    box.appendChild(b);
  });
}

function ensureHold() {
  const maxM = N() - 1;
  STATE.hold = Math.min(STATE.holdPref, maxM);
  const btns = document.querySelectorAll('#holdGrp button');
  let matched = false;
  btns.forEach(b => {
    const ok = +b.dataset.h === STATE.hold;
    if (ok) matched = true;
    b.setAttribute('aria-pressed', String(ok));
  });
  if (!matched) btns.forEach(b => b.setAttribute('aria-pressed', 'false'));
}
function clampStart() {
  const n = N();
  if (STATE.startIdx + STATE.hold > n - 1) STATE.startIdx = Math.max(0, n - 1 - STATE.hold);
  if (STATE.startIdx < 0) STATE.startIdx = 0;
}
function syncSelects() {
  const d = A().d, selY = document.getElementById('selY'), selM = document.getElementById('selM');
  const cur = d[STATE.startIdx];
  const years = [...new Set(d.map(x => x.slice(0, 4)))];
  selY.textContent = '';
  years.forEach(y => {
    const o = document.createElement('option'); o.value = y; o.textContent = y + ' 年';
    if (y === cur.slice(0, 4)) o.selected = true;
    selY.appendChild(o);
  });
  selM.textContent = '';
  for (let m = 1; m <= 12; m++) {
    const mm = String(m).padStart(2, '0');
    const o = document.createElement('option'); o.value = mm; o.textContent = mm + ' 月';
    if (mm === cur.slice(5, 7)) o.selected = true;
    selM.appendChild(o);
  }
}
function setStartFromSelects() {
  const y = document.getElementById('selY').value, m = document.getElementById('selM').value;
  const d = A().d;
  let idx = d.findIndex(x => x >= y + '-' + m);
  if (idx < 0) idx = d.length - 1 - STATE.hold;
  STATE.startIdx = Math.max(0, Math.min(idx, d.length - 1 - STATE.hold));
  syncSelects(); refresh();
}

function refresh() {
  drawA(); drawB(); renderCards(); renderVerdict(); renderTable();
}

document.getElementById('selY').addEventListener('change', setStartFromSelects);
document.getElementById('selM').addEventListener('change', setStartFromSelects);
document.querySelectorAll('#holdGrp button').forEach(b => b.addEventListener('click', () => {
  const want = +b.dataset.h;
  STATE.holdPref = want;
  STATE.hold = Math.min(want, N() - 1);
  document.querySelectorAll('#holdGrp button').forEach(x => x.setAttribute('aria-pressed', String(+x.dataset.h === STATE.hold)));
  clampStart(); syncSelects(); refresh();
}));
document.querySelectorAll('#contribGrp button').forEach(b => b.addEventListener('click', () => {
  STATE.contribs = +b.dataset.c;
  document.querySelectorAll('#contribGrp button').forEach(x => x.setAttribute('aria-pressed', String(x === b)));
  refresh();
}));

/* 滑鼠 */
function bindHover(cv, plotEl, key) {
  cv.addEventListener('pointermove', e => {
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left, y = e.clientY - r.top;
    if (key === 'A') {
      if (!CUR) return;
      const G = GA, n = CUR.cv.length;
      const i = Math.round((x - G.l) / (G.W - G.l - G.r) * (n - 1));
      STATE.hoverA = (i >= 0 && i < n) ? i : null;
      if (STATE.hoverA == null) tipA.style.display = 'none';
      drawA();
    } else {
      if (!ROLL.length) return;
      const G = GB, n = ROLL.length;
      const i = Math.round((x - G.l) / (G.W - G.l - G.r) * (n - 1));
      STATE.hoverB = (i >= 0 && i < n) ? i : null;
      if (STATE.hoverB == null) tipB.style.display = 'none';
      drawB();
    }
  });
  cv.addEventListener('pointerleave', () => {
    if (key === 'A') { STATE.hoverA = null; tipA.style.display = 'none'; drawA(); }
    else { STATE.hoverB = null; tipB.style.display = 'none'; drawB(); }
  });
  cv.addEventListener('click', e => {
    if (key !== 'B' || !ROLL.length) return;
    const r = cv.getBoundingClientRect(), x = e.clientX - r.left;
    const n = ROLL.length;
    let i = Math.round((x - GB.l) / (GB.W - GB.l - GB.r) * (n - 1));
    i = Math.max(0, Math.min(n - 1, i));
    STATE.startIdx = ROLL[i].s;
    clampStart(); syncSelects(); refresh();
  });
}
bindHover(cvA, plotA, 'A');
bindHover(cvB, plotB, 'B');

window.addEventListener('resize', () => { drawA(); drawB(); });
